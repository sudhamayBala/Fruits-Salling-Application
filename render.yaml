services:
  - type: web
    name: fruit-house-backend
    runtime: docker
    plan: starter
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    healthCheckPath: /health
    disk:
      name: fruit-house-uploads
      mountPath: /app/Fruit Content/Api/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://fruit-house-frontend.onrender.com

  - type: web
    name: fruit-house-frontend
    runtime: static
    rootDir: Frontend/View
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fruits-salling-application.onrender.com
