services:
  - type: web
    name: fruit-house-backend
    runtime: docker
    plan: starter
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    healthCheckPath: /health
    disk:
      name: fruit-house-uploads
      mountPath: /app/Fruit Content/Api/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://fruits-salling-85mrjoukv-sudha19.vercel.app,https://fruits-salling-app.vercel.app,https://fruits-salling-app-git-main-sudha19.vercel.app

  - type: web
    name: fruit-house-frontend
    runtime: static
    buildCommand: npm ci --include=dev --prefix Frontend/View && npm run build --prefix Frontend/View
    staticPublishPath: Frontend/View/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fruits-salling-application.onrender.com
